{%- assign p = site.data.profile -%}
<footer class="site-footer">
  <div class="container">
    <ul class="footer-links">
      <li><a href="mailto:{{ p.email }}">Email</a></li>
      {%- for l in p.links %}
      <li><a href="{{ l.url }}" rel="me">{{ l.label }}</a></li>
      {%- endfor %}
    </ul>
    <p class="fine">&copy; {{ site.time | date: "%Y" }} {{ p.name }}. Last updated {{ site.time | date: "%B %Y" }}.</p>
  </div>
</footer>
