<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <nav aria-label="Main">
      <ul class="nav-list">
        {%- for item in site.data.profile.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch between light and dark theme">
      <span class="icon-sun">{% include icon.html name="sun" %}</span>
      <span class="icon-moon">{% include icon.html name="moon" %}</span>
    </button>
  </div>
</header>
